# Function: Guarded Alpaca live-trading runtime configuration.
# Used by: scripts/run_live_trading.py --config configs/live_alpaca.yaml.
# Notes: Live mode is intentionally disabled by default. Use --dry-run and
#        --confirm-live-safety for non-ordering initialization checks.

# Inherit shared defaults from configs/base.yaml.
extends: base.yaml

runtime:
  # Options: BACKTEST, PAPER, LIVE. Live engine requires LIVE.
  mode: LIVE

# Runtime universe. This must be explicit; strategy-level symbols can narrow it.
symbols: [SPY]

# Domain timeframe for locally normalized bars.
# Options: SECOND, MINUTE, HOUR, DAY.
timeframe: MINUTE

# Canonical exchange/session service used by live health and safety gates.
market_session:
  # Options currently supported by the built-in provider: XNYS, NASDAQ.
  exchange: XNYS
  # Session clock timezone.
  timezone: America/New_York
  # true permits only [regular_open, regular_close); false can use extended_hours.
  regular_session_only: true
  # Fail closed if a session cannot be resolved.
  fail_closed: true
  # Options currently supported: builtin_us_equity.
  calendar_provider: builtin_us_equity

# Live runtime event source.
market_data:
  # Options for this runtime scaffold: external_events. Dry-run engine usage can
  # preview decisions from externally supplied normalized Bar events, but real
  # live stream ownership remains a future phase.
  provider: external_events

# Alpaca live brokerage settings.
broker:
  # Options for live script: alpaca_live. Paper script supports alpaca_paper/ibkr_paper.
  broker_type: alpaca_live
  # false selects live brokerage mode.
  paper: false
  # Environment variable containing Alpaca live trading base URL.
  base_url_env: ALPACA_LIVE_BASE_URL
  # Environment variable names for credentials.
  credential_env_keys:
    # Alpaca API key id env var.
    api_key_id: ALPACA_API_KEY_ID
    # Alpaca secret key env var.
    secret_key: ALPACA_SECRET_KEY
  # Live safety gates. Keep conservative defaults until you intentionally enable
  # live trading after account and symbol allowlists are correct.
  safety:
    # Must be true before the live engine can submit live orders.
    live_enabled: false
    # Must be true as a second explicit operator confirmation.
    confirm_live_trading: false
    # true routes through dry-run/mock brokerage behavior.
    dry_run: false
    # true uses in-memory broker client behavior.
    mock_mode: false
    # true requires broker.account_id to appear in allowed_account_ids.
    require_account_allowlist: true
    # Account ids allowed for live trading. Empty rejects all when allowlist is required.
    allowed_account_ids: []
    # true requires all strategy symbols to appear in allowed_symbols.
    require_symbol_allowlist: true
    # Symbols allowed for live trading.
    allowed_symbols: [SPY]
    # Maximum notional allowed for any single live order.
    max_order_notional: 1000
    # Maximum quantity allowed for any single live order.
    max_order_quantity: 10

# Account/reporting currency.
portfolio:
  currency: USD

# Strategies loaded by the live engine.
strategies:
  # Reusable strategy profile. Symbols must also be permitted by
  # broker.safety.allowed_symbols.
  - config_ref: strategies/sma_crossover.yaml

# Reusable risk profile. Paths are relative to this config file.
risk_ref: risk/base.yaml

# Live template risk sizing. Notional is zero by default to avoid accidental
# order sizing if safety gates are changed without updating risk intentionally.
risk:
  # Explicitly marks this live template as not ready for order sizing.
  disabled_until_configured: true
  sizing_parameters:
    # Must be positive before fixed_notional sizing can approve trades.
    notional_per_trade: 0

# Execution settings.
execution:
  # true permits fractional share quantities when the broker and asset support them.
  allow_fractional: false

# Runtime health/telemetry toggle.
monitoring:
  # true enables monitoring hooks when configured.
  enabled: true
