extends: base.yaml

runtime:
  mode: BACKTEST

date_range:
  start: null
  end: null

market_data:
  provider: local_parquet
  path: data/raw/bars.parquet
  adjustment: RAW

broker:
  broker_type: backtest
  fill_policy: next_bar_open
  commission_model:
    type: per_share
    value: 0.0
  slippage_model:
    type: bps
    value: 0.0

portfolio:
  starting_cash: 100000
  currency: USD

strategies: []

risk:
  sizing_method: fixed_notional
  sizing_parameters:
    notional_per_trade: 5000

execution:
  allow_fractional: false

reporting:
  output_dir: artifacts/reports
