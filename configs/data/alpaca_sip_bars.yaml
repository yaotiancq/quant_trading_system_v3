market_data:
  provider: alpaca_sip
  asset_class: stocks
  symbols: [SPY, AAPL, MSFT]
  timeframe: 1min
  start: 2026-05-22T13:30:00Z
  end: 2026-05-22T20:00:00Z
  feed: sip
  adjustment: raw
  sort: asc
  limit: 10000
  base_url_env: ALPACA_DATA_BASE_URL
  # Alpaca is asked for the full configured interval. Returned rows are then
  # filtered locally by bar start time in America/New_York.
  session_filter:
    enabled: true
    timezone: America/New_York
    start: "09:30"
    end: "16:00"

credentials:
  api_key_id_env: ALPACA_API_KEY_ID
  secret_key_env: ALPACA_SECRET_KEY

output:
  # Supported values: csv, parquet.
  format: csv
  # Supported values: partitioned, single_file.
  layout: partitioned
  directory: data/alpaca
  # Partitioned datasets write one or more files below:
  #   data/alpaca/timeframe=1Min/symbol=SPY/date=2026-05-22/
  partition_by: [timeframe, symbol, date]
  # Available placeholders: {feed}, {symbols}, {symbol}, {timeframe}, {start},
  # {end}, {date}, {adjustment}, {format}.
  filename_template: bars_{start}_{end}.{format}
