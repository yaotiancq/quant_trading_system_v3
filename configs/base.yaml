# Function: Shared defaults inherited by runtime configs with `extends: base.yaml`.
# Used by: qts.core.load_runtime_config(), qts.cli, scripts/run_backtest.py,
#          scripts/run_paper_trading.py, and scripts/run_live_trading.py.
# Notes: Child configs override these values by repeating the same key path.

# Project metadata used in logs, reports, and generated artifact context.
project:
  # Free-form project name. Keep stable if you want comparable artifacts.
  name: quant_trading_system_v3

# Shared runtime metadata. Active runtime configs must define their own mode,
# symbols, and timeframe so operational behavior cannot silently fall back to a
# base default.
runtime:
  # IANA timezone name used as metadata. Timestamps in configs should still be UTC
  # or include an explicit offset.
  timezone: UTC

# Default repository-relative paths.
paths:
  # Raw or normalized market data root.
  data: data
  # Generated reports, models, and operational artifacts.
  artifacts: artifacts
  # Log output directory.
  logs: artifacts/logs

# Logging defaults consumed by qts.core.configure_logging().
logging:
  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL.
  level: INFO
  # true emits JSON-like structured logs; false emits plain text logs.
  structured: true
