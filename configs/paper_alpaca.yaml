# Function: Alpaca paper-trading runtime configuration.
# Used by: scripts/run_paper_trading.py --config configs/paper_alpaca.yaml.
# Notes: Use --mock for credential-free smoke checks and --dry-run to initialize,
#        reconcile, print health, and exit.

# Inherit shared defaults from configs/base.yaml.
extends: base.yaml

runtime:
  # Options: BACKTEST, PAPER, LIVE. Paper engine requires PAPER.
  mode: PAPER

# Runtime universe. This must be explicit; strategy-level symbols can narrow it.
symbols: [SPY]

# Domain timeframe for locally normalized bars.
# Options: SECOND, MINUTE, HOUR, DAY.
timeframe: MINUTE

# Canonical exchange/session service used for runtime session checks.
market_session:
  # Options currently supported by the built-in provider: XNYS, NASDAQ.
  exchange: XNYS
  # Session clock timezone.
  timezone: America/New_York
  # true permits only [regular_open, regular_close); false can use extended_hours.
  regular_session_only: true
  # Fail closed if a session cannot be resolved.
  fail_closed: true
  # Options currently supported: builtin_us_equity.
  calendar_provider: builtin_us_equity

# Paper runtimes receive bars/events from an event source. Use external_events
# when another process calls engine.on_market_event(); use fake_stream for a
# finite normalized in-memory event list; use alpaca_stream when an Alpaca
# stream adapter client or mock Alpaca-shaped messages are configured.
market_data:
  # Options for PAPER: external_events, fake_stream, alpaca_stream.
  provider: external_events

# Alpaca paper brokerage settings.
broker:
  # Options for paper script: alpaca_paper, ibkr_paper.
  broker_type: alpaca_paper
  # true selects Alpaca paper mode; live configs must set false.
  paper: true
  # Environment variable containing Alpaca paper trading base URL.
  base_url_env: ALPACA_PAPER_BASE_URL
  # Environment variable names for credentials.
  credential_env_keys:
    # Alpaca API key id env var.
    api_key_id: ALPACA_API_KEY_ID
    # Alpaca secret key env var.
    secret_key: ALPACA_SECRET_KEY
  # Safety gates used by the paper broker adapter.
  safety:
    # true uses the in-memory mock client and does not require credentials.
    mock_mode: false
    # true rejects configs that do not look like paper trading.
    require_paper: true

# Account/reporting currency.
portfolio:
  currency: USD

# Strategies loaded by the paper engine.
strategies:
  # Reusable strategy profile. Paths are relative to this config file.
  - config_ref: strategies/sma_crossover.yaml

# Reusable risk profile. Paths are relative to this config file.
risk_ref: risk/base.yaml

# Risk sizing for paper orders.
risk:
  # Override selected fields from configs/risk/base.yaml.
  sizing_parameters:
    # Used by fixed_notional/fixed_dollar.
    notional_per_trade: 1000

# Execution settings.
execution:
  # Alpaca can support fractional shares for eligible assets, but this template
  # uses fixed-notional sizing, so fractional/notional order behavior is enabled.
  allow_fractional: true

# Runtime health/telemetry toggle.
monitoring:
  # true enables monitoring hooks when configured.
  enabled: false
